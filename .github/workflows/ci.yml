name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend tests (mock gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Hard rule: CI never makes real LLM calls. No GEMINI_API_KEY exists
      # in this workflow, and the gateway factory refuses real mode without one.
      LLM_GATEWAY_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # WeasyPrint native deps: CI exercises the real PDF engine (the
      # Windows dev box falls back to fpdf2).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b
      - run: pip install -r requirements.txt
      - run: python -c "import weasyprint; print('weasyprint', weasyprint.__version__)"
      - run: python -m pytest -v
